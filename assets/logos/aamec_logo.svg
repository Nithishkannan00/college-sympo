<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#D93800"/>
    </linearGradient>
    <path id="textCircleTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
    <path id="textCircleBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  </defs>
  
  <!-- Outer Ring & Border -->
  <circle cx="100" cy="100" r="94" fill="#0B0E14" stroke="#FF5500" stroke-width="3"/>
  <circle cx="100" cy="100" r="82" fill="#121620" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <!-- Gear Teeth around center -->
  <g fill="none" stroke="#FF5500" stroke-width="2" opacity="0.6">
    <circle cx="100" cy="100" r="60" stroke-dasharray="6,4"/>
  </g>
  
  <!-- Central Emblem: Temple Gopuram & Technical Book Motif -->
  <g transform="translate(100, 95) scale(0.9)">
    <!-- Gopuram Tower Silhouette -->
    <path d="M-18, -10 L18, -10 L14, -28 L20, -30 L10, -48 L-10, -48 L-20, -30 L-14, -28 Z" fill="#FF5500"/>
    <rect x="-6" y="-55" width="12" height="7" fill="#FFFFFF"/>
    <polygon points="0,-60 -5,-55 5,-55" fill="#FF5500"/>
    
    <!-- Open Book -->
    <path d="M-28, 12 Q-14, 5 0, 10 Q14, 5 28, 12 L24, 25 Q12, 20 0, 24 Q-12, 20 -24, 25 Z" fill="#FFFFFF"/>
    <path d="M0, 10 L0, 24" stroke="#0B0E14" stroke-width="1.5"/>
    
    <!-- Lamp of Knowledge / Flame -->
    <path d="M-6, -2 Q0, -8 0, -12 Q0, -8 6, -2 Q0, 3 -6, -2 Z" fill="#FFB703"/>
  </g>
  
  <!-- Inscription Text -->
  <text font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      ANJALAI AMMAL MAHALINGAM
    </textPath>
  </text>
  <text font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="700" fill="#FF5500" letter-spacing="1">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ENGG. COLLEGE • KOVILVENNI
    </textPath>
  </text>
  
  <!-- Star accents -->
  <circle cx="28" cy="100" r="2.5" fill="#FF5500"/>
  <circle cx="172" cy="100" r="2.5" fill="#FF5500"/>
</svg>
